<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="/images/app-icon.png" />
    <meta name="theme-color" content="#f5f8fd" />
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("only-talk-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>Only Talk - 极速 · 安全 · 畅聊无限</title>
    <meta
      name="description"
      content="Only Talk 是一款跨平台即时通讯应用，支持桌面端与移动端，提供实时聊天、P2P 通信与视频通话。极速 · 安全 · 畅聊无限。"
    />
    <meta property="og:title" content="Only Talk" />
    <meta
      property="og:description"
      content="极速 · 安全 · 畅聊无限 - 跨平台即时通讯"
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
